# Gera APKs na nuvem: aba Actions > APK > Run workflow.
#   - "app" preenchido (ex.: examples/apps/contador)  -> APK desse app Slip
#   - "app" vazio                                     -> APK do IDE Slip Script
# O APK sai em "Artifacts" no fim da execução (zip com o .apk dentro).
# Assinatura opcional: secrets SLIP_KEYSTORE_BASE64, SLIP_KEYSTORE_PASSWORD, SLIP_KEY_ALIAS, SLIP_KEY_PASSWORD.
name: APK
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Pasta do app Slip (com main.slip). Vazio = IDE Slip Script"
        default: "examples/apps/contador"
        required: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Chave de assinatura (se houver secret)
        env:
          KS64: ${{ secrets.SLIP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS64" ]; then
            echo "$KS64" | base64 -d > "$RUNNER_TEMP/slip.keystore"
            echo "SLIP_KEYSTORE=$RUNNER_TEMP/slip.keystore" >> "$GITHUB_ENV"
          fi
      - name: Gerar APK
        env:
          APP: ${{ inputs.app }}
          SLIP_KEYSTORE_PASSWORD: ${{ secrets.SLIP_KEYSTORE_PASSWORD }}
          SLIP_KEY_ALIAS: ${{ secrets.SLIP_KEY_ALIAS }}
          SLIP_KEY_PASSWORD: ${{ secrets.SLIP_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$APP" ]; then
            bash tools/slip2apk.sh "$APP" --out dist/app.apk
          else
            sh gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/*.apk dist/slip-ide.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
